<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"><meta name="viewport" content="width=device-width,initial-scale=1"><title>解析曲面标架工作台</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span class="mark">∿</span><div><strong>解析曲面标架工作台</strong><small>ANALYTIC SURFACE · CCS FRAME</small></div></div><div class="toolbar"><button id="generate" class="primary">生成曲面</button><button id="project">投影曲线</button><button id="import">导入二维曲线</button><button id="save">保存工程</button><button id="export">导出 OBJ</button><button id="blender">在 Blender 中查看</button><button id="open">打开工程</button></div></header>
<main><aside class="left"><div class="panel-heading"><span>解析函数库</span><b id="modelCount"></b></div><input id="search" placeholder="搜索曲面名称…"><div id="catalog"></div></aside><section class="workspace"><div class="view-title"><span id="surfaceName">曲面预览</span><span id="viewStats">旋转：左键拖拽 · 缩放：滚轮</span></div><div id="viewport"></div><div class="bottom"><div class="panel-heading"><span>二维标架曲线</span><div class="tiny-buttons"><button id="addFrame">添加标架</button><button id="removeFrame">删除</button><button id="resetFrames">重置</button></div></div><canvas id="curveCanvas"></canvas><p class="hint">拖拽圆点移动标架，拖拽箭头调整切向角度和尺度；按住 Alt 拖拽圆点调整离面位移。曲线变化时曲面局部随之更新。</p></div></section><aside class="right"><div class="panel-heading">曲面参数</div><div id="params"></div><div class="panel-heading section-heading">投影与变形</div><label class="field">变形强度 <input id="strength" type="range" min="0" max="3" step="0.05" value="1"><output id="strengthValue">1.00</output></label><label class="field">影响半径 <input id="width" type="range" min="0.08" max="0.9" step="0.01" value="0.32"><output id="widthValue">0.32</output></label><label class="check"><input id="closed" type="checkbox" checked>闭合曲线</label><label class="check"><input id="trim" type="checkbox">生成边界裁剪面</label><label class="check"><input id="wire" type="checkbox">显示网格</label><label class="check"><input id="uniform" type="checkbox" checked>均匀重网格</label><div class="panel-heading section-heading">选中标架</div><div id="frameInfo" class="info">点击二维视图中的标架</div><div class="panel-heading section-heading">几何信息</div><div id="geometryInfo" class="info"></div><div class="note">闭合边界作为参数域外环，环内区域经受约束三角化后映射到曲面。OBJ 中边界线与裁剪面共用顶点。</div></aside></main><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
